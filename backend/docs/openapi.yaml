openapi: 3.0.3
info:
  title: AttendEase API
  description: |
    Multi-tenant SaaS platform for educational institutions.
    Manages attendance, timetables, academics, exams, fees, roles, and billing.

    ## Authentication
    All protected endpoints require a JWT Bearer token in the `Authorization` header.
    Obtain tokens via the `/api/auth/login` endpoints.

    ## Tenant Scoping
    Non-super-admin users are automatically scoped to their tenant via the JWT.
    Super admins can access any tenant's data by passing `tenantId` as a query parameter.

    ## Rate Limits
    - Login endpoints: 10 requests per 15 minutes
    - Auth endpoints: 30 requests per 15 minutes
    - Other endpoints: configurable per-route
  version: 1.0.0
  contact:
    name: AttendEase Support
  license:
    name: MIT

servers:
  - url: http://localhost:8011/api
    description: Local development
  - url: https://api.attendEase.com/api
    description: Production

tags:
  - name: Auth
    description: Authentication, registration, 2FA, sessions
  - name: Admin
    description: Tenant admin — teachers, subjects, assignments, enrollments
  - name: Super Admin
    description: Cross-tenant management — tenants, stats, monitoring
  - name: Students
    description: Student CRUD
  - name: Attendance
    description: Mark, query, and report attendance
  - name: Timetable
    description: Weekly timetable management
  - name: Subjects
    description: Subject CRUD and search
  - name: Exams
    description: Exam schedule, grading, results
  - name: Fees
    description: Fee records, collections, waivers, transactions
  - name: Academic
    description: Courses, branches, semesters, promotion
  - name: Roles
    description: Custom roles and RBAC
  - name: Tenant
    description: Tenant settings, branding, usage
  - name: Billing
    description: Subscriptions, invoices, payments (Razorpay)
  - name: Plans
    description: Super-admin plan management
  - name: Support
    description: Support tickets
  - name: Reports
    description: Attendance reports and CSV export
  - name: Parent
    description: Parent portal — child attendance, alerts
  - name: Calendar
    description: Calendar events
  - name: Alerts
    description: Notifications and alerts
  - name: Tickets
    description: Student absence proof tickets
  - name: Landing
    description: Public marketing endpoints
  - name: Users
    description: Profile, student/teacher/admin management, bulk ops

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, teacher, student, parent]
        tenantId:
          type: string
        rollNo:
          type: string
        section:
          type: string
        courseId:
          type: string
        courseName:
          type: string
        branch:
          type: string
        semester:
          type: integer
        isActive:
          type: boolean

    Tenant:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        subdomain:
          type: string
        contact:
          type: object
          properties:
            email:
              type: string
        branding:
          type: object
          properties:
            logo:
              type: string
            favicon:
              type: string
            primaryColor:
              type: string
            secondaryColor:
              type: string
        subscription:
          type: object
          properties:
            plan:
              type: string
            status:
              type: string
            billingCycle:
              type: string
        settings:
          type: object

    Plan:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        code:
          type: string
        pricing:
          type: object
          properties:
            monthly:
              type: number
            yearly:
              type: number
        modules:
          type: object
          additionalProperties:
            type: boolean
        limits:
          type: object
          additionalProperties:
            type: integer

    Course:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        code:
          type: string
        durationYears:
          type: integer
        semestersPerYear:
          type: integer
        branches:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              code:
                type: string
        tenantId:
          type: string

    Subject:
      type: object
      properties:
        _id:
          type: string
        subjectName:
          type: string
        subjectCode:
          type: string
        courseId:
          type: string
        branch:
          type: string
        semester:
          type: integer
        credits:
          type: integer
        isActive:
          type: boolean
        tenantId:
          type: string

    TimetableEntry:
      type: object
      properties:
        _id:
          type: string
        section:
          type: string
        courseCode:
          type: string
        branch:
          type: string
        semester:
          type: integer
        day:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "09:45"
        room:
          type: string
        teacherId:
          type: string
        subjectId:
          type: string
        isNoClass:
          type: boolean

    Attendance:
      type: object
      properties:
        _id:
          type: string
        studentId:
          type: string
        timetableId:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [present, absent, late, leave]
        remarks:
          type: string
        subject:
          type: object
          properties:
            subjectCode:
              type: string
            subjectName:
              type: string

    Exam:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        subjectId:
          type: string
        subjectName:
          type: string
        section:
          type: string
        type:
          type: string
          enum: [midterm, final, quiz, assignment]
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        maxMarks:
          type: integer
        room:
          type: string
        instructions:
          type: string

    Fee:
      type: object
      properties:
        _id:
          type: string
        studentId:
          type: string
        feeType:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [pending, paid, partial, waived, overdue]
        section:
          type: string
        academicYear:
          type: string
        description:
          type: string
        waivedAmount:
          type: number

    CustomRole:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    Alert:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [info, warning, error, success]
        targetRoles:
          type: array
          items:
            type: string
        isRead:
          type: boolean

    Ticket:
      type: object
      properties:
        _id:
          type: string
        studentId:
          type: string
        subjectId:
          type: string
        absentDate:
          type: string
          format: date
        reason:
          type: string
          enum: [medical, family, personal, academic, other]
        reasonDescription:
          type: string
        verificationStatus:
          type: string
          enum: [pending, approved, rejected]

    CalendarEvent:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string
        type:
          type: string
          enum: [event, holiday, exam, meeting, deadline]

    SupportTicket:
      type: object
      properties:
        _id:
          type: string
        subject:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [billing, technical, account, feature_request, other]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [open, in_progress, resolved, closed]

    Subscription:
      type: object
      properties:
        plan:
          type: string
        status:
          type: string
        billingCycle:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Invoice:
      type: object
      properties:
        _id:
          type: string
        amount:
          type: number
        status:
          type: string
        date:
          type: string
          format: date
        planCode:
          type: string

paths:
  # ─── Auth ──────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Tenant admin/teacher/student login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                subdomain:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: credentials

  /auth/parent-login:
    post:
      tags: [Auth]
      summary: Parent login
      operationId: parentLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, subdomain]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                subdomain:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/super-admin/login:
    post:
      tags: [Auth]
      summary: Super admin platform login
      operationId: superAdminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/register/student:
    post:
      tags: [Auth]
      summary: Student self-registration
      operationId: registerStudent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, confirmPassword, enrollmentNumber, subdomain]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                confirmPassword:
                  type: string
                enrollmentNumber:
                  type: string
                subdomain:
                  type: string
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error

  /auth/register/teacher/first-login:
    post:
      tags: [Auth]
      summary: Teacher first-time setup (set permanent password)
      operationId: registerTeacherFirstLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tempPassword, newPassword, confirmPassword, subdomain]
              properties:
                email:
                  type: string
                tempPassword:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
                subdomain:
                  type: string
      responses:
        '200':
          description: Password set successfully
        '400':
          description: Validation error

  /auth/tenant-info:
    get:
      tags: [Auth]
      summary: Get tenant info by subdomain
      operationId: getTenantInfo
      security: []
      parameters:
        - name: subdomain
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Tenant info
        '404':
          description: Tenant not found

  /auth/verify:
    get:
      tags: [Auth]
      summary: Verify JWT token
      operationId: verifyToken
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid token

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword, confirmPassword]
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation error

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (client-side token removal)
      operationId: logout
      responses:
        '200':
          description: Logged out

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Initiate 2FA setup (returns QR code)
      operationId: setup2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 2FA secret and QR code URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      secret:
                        type: string
                      qrCodeUrl:
                        type: string

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify a 2FA token (enable 2FA)
      operationId: verify2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: 2FA enabled

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      operationId: disable2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 2FA disabled

  /auth/2fa/status:
    get:
      tags: [Auth]
      summary: Check 2FA status
      operationId: get2FAStatus
      responses:
        '200':
          description: 2FA status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      enabled:
                        type: boolean

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      operationId: getSessions
      responses:
        '200':
          description: Session list

  /auth/sessions/logout-all:
    post:
      tags: [Auth]
      summary: Invalidate all sessions
      operationId: logoutAllSessions
      responses:
        '200':
          description: All sessions invalidated

  # ─── Admin ─────────────────────────────────────────────────────────
  /admin/teachers:
    get:
      tags: [Admin]
      summary: List all teachers
      operationId: listTeachers
      responses:
        '200':
          description: Teacher list with assignments

  /admin/subjects:
    get:
      tags: [Admin]
      summary: List all subjects
      operationId: listAdminSubjects
      responses:
        '200':
          description: Subject list

  /admin/enrollments:
    get:
      tags: [Admin]
      summary: List all enrollments
      operationId: listEnrollments
      responses:
        '200':
          description: Enrollment list

  /admin/enrollments/{id}:
    get:
      tags: [Admin]
      summary: Get enrollment by ID
      operationId: getEnrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrollment details

  /admin/enrollments/section/{section}:
    get:
      tags: [Admin]
      summary: Get enrollments by section
      operationId: getEnrollmentsBySection
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrollment list

  /admin/my-enrollment:
    get:
      tags: [Admin]
      summary: Get current user's enrollment
      operationId: getMyEnrollment
      responses:
        '200':
          description: Enrollment details

  /admin/assignments:
    get:
      tags: [Admin]
      summary: List all teacher-subject assignments
      operationId: listAssignments
      responses:
        '200':
          description: Assignment list

  /admin/assignments/teacher/{teacherId}:
    get:
      tags: [Admin]
      summary: Get assignments by teacher
      operationId: getAssignmentsByTeacher
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignment list

  /admin/assignments/subject/{subjectId}:
    get:
      tags: [Admin]
      summary: Get assignments by subject
      operationId: getAssignmentsBySubject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignment list

  /admin/assignments/section/{section}:
    get:
      tags: [Admin]
      summary: Get assignments by section
      operationId: getAssignmentsBySection
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignment list

  /admin/assign-subject:
    post:
      tags: [Admin]
      summary: Assign subject to teacher
      operationId: assignSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherId, subjectId, section]
              properties:
                teacherId:
                  type: string
                subjectId:
                  type: string
                section:
                  type: string
      responses:
        '201':
          description: Assignment created

  /admin/teachers/{id}:
    delete:
      tags: [Admin]
      summary: Delete a teacher (hard delete with cascade)
      operationId: deleteTeacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teacher deleted

  /admin/create-teacher:
    post:
      tags: [Admin]
      summary: Create a teacher
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, employeeId]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                employeeId:
                  type: string
                phone:
                  type: string
                department:
                  type: string
                qualification:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Teacher created
        '409':
          description: Duplicate email

  /admin/create-subject:
    post:
      tags: [Admin]
      summary: Create a subject
      operationId: createAdminSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, courseId, branch, semester]
              properties:
                name:
                  type: string
                code:
                  type: string
                courseId:
                  type: string
                branch:
                  type: string
                semester:
                  type: integer
                credits:
                  type: integer
      responses:
        '201':
          description: Subject created

  /admin/bulk-subjects:
    post:
      tags: [Admin]
      summary: Bulk create subjects
      operationId: bulkCreateSubjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjects]
              properties:
                subjects:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Subjects created
        '400':
          description: Validation errors

  /admin/bulk-teachers:
    post:
      tags: [Admin]
      summary: Bulk create teachers
      operationId: bulkCreateTeachers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teachers]
              properties:
                teachers:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Teachers created

  /admin/upload-enrollments:
    post:
      tags: [Admin]
      summary: Bulk upload enrollments via CSV
      operationId: uploadEnrollments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Enrollments imported

  # ─── Super Admin ───────────────────────────────────────────────────
  /admin/super/tenants:
    get:
      tags: [Super Admin]
      summary: List all tenants
      operationId: listTenants
      responses:
        '200':
          description: Tenant list

  /admin/super/tenants/{tenantId}:
    get:
      tags: [Super Admin]
      summary: Get tenant details
      operationId: getTenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
    delete:
      tags: [Super Admin]
      summary: Delete a tenant and all data
      operationId: deleteTenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant deleted

  /admin/super/tenants/{tenantId}/subscription:
    put:
      tags: [Super Admin]
      summary: Update tenant subscription
      operationId: updateTenantSubscription
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                status:
                  type: string
                billingCycle:
                  type: string
      responses:
        '200':
          description: Subscription updated

  /admin/super/tenants/{tenantId}/suspend:
    post:
      tags: [Super Admin]
      summary: Suspend a tenant
      operationId: suspendTenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant suspended

  /admin/super/tenants/{tenantId}/activate:
    post:
      tags: [Super Admin]
      summary: Activate a suspended tenant
      operationId: activateTenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant activated

  /admin/super/stats:
    get:
      tags: [Super Admin]
      summary: Platform-wide statistics
      operationId: getPlatformStats
      responses:
        '200':
          description: Platform stats

  /admin/super/logs:
    get:
      tags: [Super Admin]
      summary: Paginated activity logs
      operationId: getActivityLogs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
